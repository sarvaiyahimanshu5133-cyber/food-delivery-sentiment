/* ====================================================== tiny chart toolkit (plain SVG) */
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v || 1))); for (const m of [1, 2, 2.5, 5, 10]) if (v <= m * p) return m * p; return 10 * p; }
function legend(items) { return `<div class="legend">${items.map(([c, t]) => `<span><i style="background:${c}"></i>${esc(t)}</span>`).join('')}</div>`; }

function lineChart({xs, series, yMax, yMin = 0, yTitle, w = 760, h = 300, fmt = v => v, band}) {
  const L = 48, R = 16, T = 14, B = 46, iw = w - L - R, ih = h - T - B;
  const all = series.flatMap(s => s.ys.filter(v => v != null)).concat(band ? band.flatMap(b => b.hi) : []);
  let ym = yMax || niceMax(Math.max(...all, 1));
  if (yMin) ym = yMin + Math.ceil((ym - yMin) / 4) * 4;          // neat tick steps
  const X = i => L + (xs.length === 1 ? iw / 2 : iw * i / (xs.length - 1)), Y = v => T + ih - ih * (v - yMin) / (ym - yMin);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img">`;
  for (let k = 0; k <= 4; k++) { const v = yMin + (ym - yMin) * k / 4; s += `<line class="ln" x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="mut" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(Math.round(v * 10) / 10)}</text>`; }
  const every = Math.ceil(xs.length / 12);
  xs.forEach((x, i) => { if (i % every === 0) s += `<text class="mut" x="${X(i)}" y="${h - B + 16}" text-anchor="middle">${esc(x)}</text>`; });
  if (yTitle) s += `<text class="mut" x="${L}" y="${h - 6}">${esc(yTitle)}</text>`;
  (band || []).forEach(b => { s += `<path d="M${b.hi.map((v, i) => `${X(i)},${Y(v)}`).join(' L')} L${b.lo.map((v, i) => `${X(b.lo.length - 1 - i)},${Y(b.lo[b.lo.length - 1 - i])}`).join(' L')} Z" fill="${b.color}" opacity=".18"/>`; });
  series.forEach(se => {
    const pts = se.ys.map((v, i) => v == null ? null : [X(i), Y(v), v, i]);
    let d = '', pen = false;
    pts.forEach(p => { if (!p) { pen = false; return; } d += `${pen ? 'L' : 'M'}${p[0]},${p[1]} `; pen = true; });
    s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    pts.forEach(p => { if (p) s += `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${se.color}" stroke="#0a1020" stroke-width="1.5"><title>${esc(se.name)} | ${esc(xs[p[3]])}: ${fmt(p[2])}${se.notes ? ' | ' + esc(se.notes[p[3]]) : ''}</title></circle>`; });
  });
  return s + '</svg>';
}

function hGrouped({labels, series, w = 760, max, fmt = v => v + '%'}) {
  const L = 255, R = 50, rowH = 24 * series.length + 14, h = labels.length * rowH + 10, iw = w - L - R;
  const m = max || niceMax(Math.max(...series.flatMap(s => s.vals), 1));
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img">`;
  labels.forEach((lb, i) => {
    const y0 = 5 + i * rowH;
    s += `<text x="${L - 10}" y="${y0 + rowH / 2 - 2}" text-anchor="end">${esc(lb)}</text>`;
    series.forEach((se, j) => { const v = se.vals[i], bw = iw * v / m, y = y0 + j * 24;
      s += `<rect x="${L}" y="${y}" width="${Math.max(bw, 1)}" height="19" rx="4" fill="${se.color}"><title>${esc(se.name)}: ${fmt(v)}</title></rect><text class="mut" x="${L + bw + 6}" y="${y + 14}">${fmt(v)}</text>`; });
  });
  return s + '</svg>';
}

function stacked100(rows, w = 760) {   // rows: [{label, segs:[{v,color,name}]}]
  const L = 90, R = 10, rh = 54, h = rows.length * rh + 26, iw = w - L - R;
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img">`;
  rows.forEach((r, i) => { let x = L; const y = 6 + i * rh;
    s += `<text x="${L - 10}" y="${y + 26}" text-anchor="end" style="font-weight:700;font-size:13px">${esc(r.label)}</text>`;
    r.segs.forEach(sg => { const bw = iw * sg.v / 100; if (bw <= 0) return;
      s += `<rect x="${x}" y="${y}" width="${bw}" height="38" fill="${sg.color}"><title>${esc(sg.name)}: ${pct(sg.v)}%</title></rect>` + (bw > 38 ? `<text x="${x + bw / 2}" y="${y + 24}" text-anchor="middle" style="fill:#07101f;font-weight:800;font-size:13px">${Math.round(sg.v)}%</text>` : '');
      x += bw; }); });
  for (let k = 0; k <= 4; k++) { const x = L + iw * k / 4; s += `<text class="mut" x="${x}" y="${h - 6}" text-anchor="middle">${k * 25}%</text>`; }
  return s + '</svg>';
}

function columns({labels, series, w = 520, h = 240, fmt = v => v + '%'}) {
  const L = 40, R = 10, T = 12, B = 34, iw = w - L - R, ih = h - T - B;
  const m = niceMax(Math.max(...series.flatMap(s => s.vals), 1)), gw = iw / labels.length, bw = Math.min(34, (gw - 14) / series.length);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img">`;
  for (let k = 0; k <= 4; k++) { const v = m * k / 4, y = T + ih - ih * v / m; s += `<line class="ln" x1="${L}" x2="${w - R}" y1="${y}" y2="${y}"/><text class="mut" x="${L - 6}" y="${y + 4}" text-anchor="end">${Math.round(v)}</text>`; }
  labels.forEach((lb, i) => { const x0 = L + i * gw + (gw - bw * series.length) / 2;
    s += `<text class="mut" x="${L + i * gw + gw / 2}" y="${h - 12}" text-anchor="middle">${esc(lb)}</text>`;
    series.forEach((se, j) => { const v = se.vals[i], bh = ih * v / m;
      s += `<rect x="${x0 + j * bw}" y="${T + ih - bh}" width="${bw - 2}" height="${bh}" rx="3" fill="${se.color}"><title>${esc(se.name)}, ${esc(lb)}: ${fmt(v)}</title></rect>`; }); });
  return s + '</svg>';
}

function heatmap(mx, w = 330) {
  const cell = 86, L = 78, T = 28, h = T + cell * 3 + 40;
  let s = `<svg viewBox="0 0 ${L + cell * 3 + 10} ${h}" role="img">`;
  LAB.forEach((l, j) => s += `<text class="mut" x="${L + cell * j + cell / 2}" y="${T - 10}" text-anchor="middle">${l}</text>`);
  mx.forEach((row, i) => { const tot = sum(row) || 1;
    s += `<text class="mut" x="${L - 8}" y="${T + cell * i + cell / 2 + 4}" text-anchor="end">${LAB[i]}</text>`;
    row.forEach((v, j) => { const f = v / tot, good = i === j;
      s += `<rect x="${L + cell * j + 2}" y="${T + cell * i + 2}" width="${cell - 4}" height="${cell - 4}" rx="8" fill="${good ? '#34d399' : '#f87171'}" fill-opacity="${0.08 + 0.85 * f}"><title>actual ${LAB[i]}, predicted ${LAB[j]}: ${v} (${pct(f * 100)}% of ${LAB[i]})</title></rect>` +
           `<text x="${L + cell * j + cell / 2}" y="${T + cell * i + cell / 2 + 2}" text-anchor="middle" style="font-weight:800;font-size:15px">${v}</text>` +
           `<text class="mut" x="${L + cell * j + cell / 2}" y="${T + cell * i + cell / 2 + 17}" text-anchor="middle">${Math.round(f * 100)}%</text>`; }); });
  s += `<text class="mut" x="${L + cell * 1.5}" y="${h - 6}" text-anchor="middle">predicted</text>`;
  return s + '</svg>';
}

/* ====================================================== 5 try it (the SAME model, running in the browser) */
const M = D.jsmodel, VOC = new Map(M.vocab.map((w, i) => [w, i]));
const POSE = new Set([...D.emoji.pos]), NEGE = new Set([...D.emoji.neg]);
function cleanText(text) {                        // identical to fdsent/clean.py
  let t = String(text).normalize('NFKC').toLowerCase();
  t = t.replace(/https?:\/\/\S+|www\.\S+|@[\p{L}\p{N}_]+/gu, ' ');
  let o = ''; for (const c of t) o += POSE.has(c) ? ' posemoji ' : NEGE.has(c) ? ' negemoji ' : c;
  t = o.replace(/(.)\1{2,}/gu, '$1$1').replace(/[^\p{L}\p{N}_\s'\u0900-\u097f]/gu, ' ');
  return t.replace(/\s+/gu, ' ').trim();
}
function predictText(text) {                      // TF-IDF + Logistic Regression, same maths as scikit-learn
  const tokens = cleanText(text).split(' ').filter(Boolean), grams = tokens.slice();
  for (let i = 0; i + 1 < tokens.length; i++) grams.push(tokens[i] + ' ' + tokens[i + 1]);
  const counts = new Map();
  grams.forEach(g => { if (VOC.has(g)) counts.set(g, (counts.get(g) || 0) + 1); });
  const feats = []; let norm = 0;
  counts.forEach((c, g) => { const j = VOC.get(g), v = (1 + Math.log(c)) * M.idf[j]; feats.push([g, j, v]); norm += v * v; });
  norm = Math.sqrt(norm) || 1;
  feats.forEach(f => f[2] /= norm);
  const logit = M.classes.map((_, c) => M.intercept[c] + sum(feats.map(f => M.coef[c][f[1]] * f[2])));
  const mx = Math.max(...logit), ex = logit.map(v => Math.exp(v - mx)), z = sum(ex), probs = ex.map(v => v / z);
  const iN = M.classes.indexOf('negative'), iP = M.classes.indexOf('positive');
  const push = feats.map(f => ({g: f[0], d: (M.coef[iN][f[1]] - M.coef[iP][f[1]]) * f[2]}));   // >0 pushes towards negative
  return {tokens, probs, label: M.classes[probs.indexOf(Math.max(...probs))], push};
}

function renderTry() {
  $('s-try').innerHTML = `<div class="grid g2" style="margin-top:0"><div class="card"><h2>Type a review</h2>
    <textarea id="tt" aria-label="Review text">${esc(EXAMPLES[0])}</textarea>
    <div class="chips">${EXAMPLES.map((e, i) => `<button class="chipbtn" data-i="${i}">${esc(e.length > 34 ? e.slice(0, 34) + '...' : e)}</button>`).join('')}</div>
    <p class="note">This is the real trained model, running inside this page. Nothing is sent anywhere.</p></div>
    <div class="card"><h2>Prediction</h2><div id="tout"></div></div></div>
    <div class="card" style="margin-top:16px"><h2>Many reviews at once</h2>
    <textarea id="tm" style="min-height:140px" aria-label="One review per line">${esc(EXAMPLES.join('\n'))}</textarea>
    <div class="bar" style="margin-top:8px"><button class="btn go" id="tmgo">Classify all</button><span id="tmmsg"></span></div>
    <div style="overflow:auto"><table id="tmtab"></table></div></div>`;
  const run = () => {
    const text = $('tt').value;
    if (!text.trim()) { $('tout').innerHTML = '<p class="note">Type something.</p>'; return; }
    const r = predictText(text), mxAbs = Math.max(...r.push.map(p => Math.abs(p.d)), 1e-9);
    const uni = new Map(r.push.filter(p => !p.g.includes(' ')).map(p => [p.g, p.d]));
    const toks = r.tokens.map(t => { const d = uni.get(t) || 0, a = Math.min(0.75, Math.abs(d) / mxAbs * 0.75);
      return `<span class="tok" style="background:${d > 0 ? 'rgba(248,113,113,' : 'rgba(52,211,153,'}${a})">${esc(t)}</span>`; }).join(' ');
    const top = (sign) => r.push.filter(p => p.d * sign > 0).sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 6)
      .map(p => `<span class="pill tp" style="outline:1px solid ${sign > 0 ? COL.negative : COL.positive}">${esc(p.g)}</span>`).join('') || '<span class="note">none</span>';
    $('tout').innerHTML = `<div class="verdict"><span class="pill ${r.label}">${r.label}</span><span class="note" style="margin:0">${pct(Math.max(...r.probs) * 100)}% sure</span></div>
      ${M.classes.map((c, i) => `<div style="display:grid;grid-template-columns:70px 1fr 52px;gap:8px;align-items:center;margin:4px 0"><span>${c}</span><div class="meter" style="height:12px"><i style="width:${r.probs[i] * 100}%;background:${COL[c]}"></i></div><span class="mut" style="color:var(--mut)">${pct(r.probs[i] * 100)}%</span></div>`).join('')}
      ${LIVE ? '<div id="vaderrow" class="note" style="margin:10px 0 0">Asking VADER...</div>' : '<div class="note" style="margin:10px 0 0">VADER\'s answer appears here when you start the project with <code>python run.py</code>.</div>'}
      <h3 style="margin-top:14px">What the model sees</h3><p style="margin:4px 0;line-height:1.9">${toks || '<span class="note">no known words</span>'}</p>
      <p class="note" style="margin-top:2px"><span class="tok" style="background:rgba(248,113,113,.6)">red</span> pushes towards negative, <span class="tok" style="background:rgba(52,211,153,.6)">green</span> towards positive. Words the model never saw in training have no colour.</p>
      <h3>Strongest clues</h3><div><b style="color:var(--neg);font-size:.8rem">NEGATIVE</b> ${top(1)}</div><div style="margin-top:6px"><b style="color:var(--pos);font-size:.8rem">POSITIVE</b> ${top(-1)}</div>`;
  };
  let tok = 0;
  const askVader = text => { if (!LIVE) return; const my = ++tok;
    post('/api/predict', {texts: [text]}).then(j => { if (my !== tok || !$('vaderrow')) return; const x = j.results[0], agree = x.vader === predictText(text).label;
      $('vaderrow').innerHTML = `The ready-made tool <b>VADER</b> says <span class="pill ${x.vader}">${x.vader}</span> (score ${x.compound >= 0 ? '+' : ''}${x.compound}). ` + (agree ? 'It agrees with the trained model.' : '<b style="color:var(--amb)">It disagrees with the trained model.</b>'); }).catch(() => {}); };
  const runBoth = () => { run(); if ($('tt').value.trim()) askVader($('tt').value); };
  $('tt').oninput = runBoth;
  $('tmgo').onclick = async () => {
    const lines = $('tm').value.split('\n').map(x => x.trim()).filter(Boolean).slice(0, 300), msg = $('tmmsg');
    if (!lines.length) { msg.textContent = 'Write one review per line.'; return; }
    let rows;
    try { rows = LIVE ? (await post('/api/predict', {texts: lines})).results : lines.map(t => { const r = predictText(t); return {text: t, label: r.label, probs: Object.fromEntries(M.classes.map((c, i) => [c, r.probs[i]])), vader: null}; }); }
    catch (e) { msg.className = 'msgl err'; msg.textContent = e.message; return; }
    msg.className = 'note'; msg.textContent = rows.length + ' reviews classified.';
    $('tmtab').innerHTML = '<tr><th>Review</th><th>Trained model</th><th>VADER</th></tr>' + rows.map(x => `<tr><td style="max-width:560px">${esc(x.text)}</td><td><span class="pill ${x.label}">${x.label}</span> <span class="note">${pct(x.probs[x.label] * 100)}%</span></td><td>${x.vader ? `<span class="pill ${x.vader}">${x.vader}</span>` : '<span class="note">needs python run.py</span>'}</td></tr>`).join('');
  };
  document.querySelectorAll('#s-try .chipbtn').forEach(b => b.onclick = () => { $('tt').value = EXAMPLES[+b.dataset.i]; runBoth(); });
  runBoth();
}

/* ====================================================== 6 reviews table */
const RV = {brand: '', pred: '', stars: '', topic: '', q: '', sort: 'new', page: 0, size: 15};
function renderReviews() {
  $('s-reviews').innerHTML = `<div class="card"><h2>Browse all reviews</h2>
    <div class="bar"><label>Brand <select id="rb"><option value="">all</option>${D.brands.map(b => `<option>${esc(b)}</option>`).join('')}</select></label>
    <label>Model says <select id="rp"><option value="">any</option>${LAB.map(l => `<option>${l}</option>`).join('')}</select></label>
    <label>Stars <select id="rs"><option value="">any</option>${[1, 2, 3, 4, 5].map(s => `<option>${s}</option>`).join('')}</select></label>
    <label>Topic <select id="rt"><option value="">any</option>${D.topic_names.map((t, i) => `<option value="${i}">${esc(t)}</option>`).join('')}</select></label>
    <label>Sort <select id="ro"><option value="new">newest first</option><option value="neg">most negative first</option><option value="pos">most positive first</option></select></label>
    <input type="search" id="rq" placeholder="search words..." aria-label="Search reviews"></div>
    <div style="overflow:auto"><table id="rtab"></table></div><div class="pager"><button id="rprev">&laquo; Prev</button><span id="rinfo"></span><button id="rnext">Next &raquo;</button></div>
    <p class="note">"Model says" is the cross-validated prediction (made by a model that had not seen that review). VADER's answer is shown for comparison. Green or red ticks show whether each one matches the star rating.</p></div>`;
  const draw = () => {
    let rows = R.filter(r => (!RV.brand || brandOf(r) === RV.brand) && (!RV.pred || LAB[r.p] === RV.pred) && (!RV.stars || r.r === +RV.stars) &&
      (RV.topic === '' || r.tp.includes(+RV.topic)) && (!RV.q || r.t.toLowerCase().includes(RV.q.toLowerCase())));
    rows = rows.slice().sort((a, b) => RV.sort === 'new' ? b.d.localeCompare(a.d) : RV.sort === 'neg' ? b.pr[0] - a.pr[0] : b.pr[2] - a.pr[2]);
    const pages = Math.max(1, Math.ceil(rows.length / RV.size)); RV.page = Math.min(RV.page, pages - 1);
    const tick = (p, y) => p === y ? '<span class="win">&#10003;</span>' : '<span style="color:var(--neg)">&#10007;</span>';
    $('rtab').innerHTML = '<tr><th>Date</th><th>Brand</th><th>Stars</th><th>Review</th><th>Model</th><th>VADER</th><th>Topics</th></tr>' +
      rows.slice(RV.page * RV.size, (RV.page + 1) * RV.size).map(r => `<tr><td class="num" style="white-space:nowrap">${esc(r.d)}</td><td style="color:${BRC[r.b % 4]}">${esc(brandOf(r))}</td><td>${r.r}&#9733;</td><td style="max-width:520px">${esc(r.t)}</td>
        <td><span class="pill ${LAB[r.p]}">${LAB[r.p]}</span> ${tick(r.p, r.y)}</td><td><span class="pill ${LAB[r.v]}">${LAB[r.v]}</span> ${tick(r.v, r.y)}</td>
        <td>${r.tp.map(i => `<span class="pill tp">${esc(D.topic_names[i])}</span>`).join('')}</td></tr>`).join('');
    $('rinfo').textContent = `${rows.length.toLocaleString()} reviews, page ${RV.page + 1} of ${pages}`;
    $('rprev').disabled = RV.page === 0; $('rnext').disabled = RV.page >= pages - 1;
  };
  const bind = (id, key) => $(id).addEventListener(id === 'rq' ? 'input' : 'change', e => { RV[key] = e.target.value; RV.page = 0; draw(); });
  bind('rb', 'brand'); bind('rp', 'pred'); bind('rs', 'stars'); bind('rt', 'topic'); bind('ro', 'sort'); bind('rq', 'q');
  $('rprev').onclick = () => { RV.page--; draw(); }; $('rnext').onclick = () => { RV.page++; draw(); };
  draw();
}

/* ====================================================== 7 method */
function renderMethod() {
  const step = (n, t, p) => `<div class="step"><b>${n}</b><h3>${t}</h3><p>${p}</p></div>`;
  $('s-method').innerHTML = `<div class="card"><h2>How the project works</h2><div class="flow">
    ${step('1 COLLECT', 'Reviews', 'Real Google Play reviews with a star rating and text (<code>fdsent/data.py</code>).')}
    ${step('2 CLEAN', 'Text cleaning', 'Lowercase, remove links, shorten "soooo" to "soo", turn emojis into words (<code>clean.py</code>).')}
    ${step('3 NUMBERS', 'TF-IDF', 'Each word gets a weight: rare, telling words count more than "the". Word pairs are included, so "not good" differs from "good".')}
    ${step('4 LEARN', 'Models', 'Naive Bayes, Linear SVM and Logistic Regression learn from the star ratings. VADER needs no training (<code>models.py</code>).')}
    ${step('5 TEST', 'Cross-validation', 'Train on 4 parts, test on the 5th, repeat 5 times. Like testing a student on questions they have not memorised.')}
    ${step('6 ANALYSE', 'Brand insights', 'Sentiment share, trend, complaint topics and common words (<code>analyze.py</code>).')}
    ${step('7 SHOW', 'This dashboard', 'One HTML page. The trained model runs inside it, so there is no server (<code>dashboard.py</code>).')}</div></div>
    <div class="grid g2"><div class="card"><h2>Key ideas</h2><ul class="clean">
      <li><b>Supervised learning:</b> the star rating is the answer key the model learns from.</li>
      <li><b>TF-IDF:</b> turns text into numbers. Term frequency (how often a word appears in a review) times inverse document frequency (how rare it is across reviews).</li>
      <li><b>Logistic Regression:</b> multiplies each word weight by a learned number and turns the total into probabilities for negative / neutral / positive.</li>
      <li><b>Accuracy vs F1:</b> accuracy is the share of correct answers. F1 balances precision and recall per class, so a rare class (neutral) cannot hide behind a big one.</li>
      <li><b>Class imbalance:</b> about 67% of reviews are positive, so a model that always says "positive" is already 67% accurate. That is why we also report F1.</li></ul></div>
    <div class="card"><h2>Limitations (honest list)</h2><ul class="clean">
      <li>The reviews cover only <b>${D.meta.days} day(s)</b>, so there is no long-term trend yet.</li>
      <li>Star ratings are an imperfect answer key: a 5-star review can still contain a complaint.</li>
      <li>Play Store reviewers are mostly very happy or very angry, not a random sample of customers.</li>
      <li>Neutral is weak (only about 4% of reviews are 3 stars).</li>
      <li>Very short or negated phrases (like "not good at all") can be misread, because the model has seen few of them.</li>
      <li>Hinglish (Hindi in English letters) is only 1-2% of the reviews, so the model handles it poorly.</li>
      <li>Complaint topics come from keyword lists, so unusual wording is missed.</li></ul></div></div>`;
}

/* ====================================================== control panel (live) */
async function post(url, body) {
  let r;
  try { r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}); }
  catch (e) { throw new Error('Cannot reach the dashboard server. Is "python run.py" still running in its window?'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('server error ' + r.status));
  return j;
}
let jobStarted = false, pollTimer = null;
function renderPanel() {
  const el = $('panel');
  if (!LIVE) { el.innerHTML = '<div class="card" style="margin-bottom:14px"><h2>Control panel</h2><p class="note" style="margin:0">The live buttons are off because you opened the saved file. Start the project with <code>python run.py</code> to use them.</p></div>'; return; }
  el.innerHTML = `<div class="card" style="margin-bottom:14px"><h2>Control panel <span class="live">LIVE</span></h2>
    <div class="bar" style="margin:0"><button class="btn go" id="p-rerun">&#8635; Re-run analysis</button>
    <span style="margin-left:14px">Download the newest</span><select id="p-count"><option>500</option><option selected>1000</option><option>2000</option><option>5000</option></select><span>reviews per brand</span>
    <button class="btn alt" id="p-collect">&#11015; Download fresh reviews</button></div>
    <div id="p-prog" hidden style="margin-top:10px"><div class="meter" style="height:12px"><i id="p-bar" style="width:0;background:var(--cy)"></i></div><p class="note" id="p-stage" style="margin:4px 0 0"></p></div>
    <p class="msgl" id="p-msg" hidden></p></div>`;
  $('p-rerun').onclick = () => startJob('/api/rerun', {});
  $('p-collect').onclick = () => startJob('/api/collect', {count: +$('p-count').value});
  fetch('/api/status').then(r => r.json()).then(s => { if (s.running) { jobStarted = true; poll(); } }).catch(() => {});
}
async function startJob(path, body) {
  const msg = $('p-msg'); msg.hidden = true;
  try { await post(path, body); jobStarted = true; poll(); }
  catch (e) { msg.hidden = false; msg.className = 'msgl err'; msg.textContent = e.message; }
}
function poll() {
  clearInterval(pollTimer);
  ['p-rerun', 'p-collect'].forEach(id => $(id).disabled = true);
  $('p-prog').hidden = false;
  const tick = async () => {
    let s; try { s = await (await fetch('/api/status')).json(); } catch (e) { return; }
    $('p-bar').style.width = s.pct + '%'; $('p-stage').textContent = s.stage + ' (' + s.pct + '%)';
    if (s.running) return;
    clearInterval(pollTimer); ['p-rerun', 'p-collect'].forEach(id => $(id).disabled = false);
    if (s.error) { const m = $('p-msg'); m.hidden = false; m.className = 'msgl err'; m.textContent = s.error; $('p-prog').hidden = true; }
    else if (s.done && jobStarted) { $('p-stage').textContent = 'Done. Reloading the dashboard with the new results...'; setTimeout(() => location.reload(), 500); }
  };
  pollTimer = setInterval(tick, 500); tick();
}

function annotate() {
  document.querySelectorAll('main h2').forEach(h => {
    const nx = h.nextElementSibling;
    if (nx && nx.classList.contains('what')) return;
    const t = h.textContent.trim().toLowerCase(), key = Object.keys(WHAT).find(k => t.startsWith(k));
    if (!key) return;
    const p = document.createElement('p'); p.className = 'what'; p.textContent = WHAT[key]; h.after(p);
  });
}
new MutationObserver(annotate).observe(document.querySelector('main'), {childList: true, subtree: true});
const TAB_WHAT = {overview: 'Start here: which brand has more unhappy customers, and what does the star pattern look like?',
  trend: 'When are customers most unhappy? The negative share by hour of the day or by day.',
  complaints: 'Why are they unhappy? Complaint topics, common words, and the real reviews behind them.',
  model: 'How good is our model compared with the ready-made tool? Scores, mistakes and what it learned.',
  try: 'Test the model yourself: type a review, or paste many at once.',
  reviews: 'Every review in the data, searchable, with what the model and VADER said about it.',
  method: 'How the whole project works step by step, and what it cannot do.'};

/* ====================================================== tabs */
const TABS = [['overview', 'Overview', renderOverview], ['trend', 'Trend', renderTrend], ['complaints', 'Why people complain', renderComplaints],
              ['model', 'Model Lab', renderModel], ['try', 'Try it', renderTry], ['reviews', 'Reviews', renderReviews], ['method', 'Method', renderMethod]];
const drawn = new Set();
function show(id) {
  const t = TABS.find(x => x[0] === id) || TABS[0];
  TABS.forEach(x => { $('s-' + x[0]).classList.toggle('on', x[0] === t[0]); });
  if (!drawn.has(t[0])) { t[2](); drawn.add(t[0]); }
  $('nav').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === t[0]));
  $('tabwhat').textContent = TAB_WHAT[t[0]] || '';
  if (location.hash !== '#' + t[0]) history.replaceState(null, '', '#' + t[0]);
}
$('nav').innerHTML = TABS.map(t => `<button data-id="${t[0]}" aria-pressed="false" title="${esc(TAB_WHAT[t[0]])}">${t[1]}</button>`).join('');
$('nav').querySelectorAll('button').forEach(b => b.onclick = () => show(b.dataset.id));
header();

show(location.hash.slice(1) || 'overview');

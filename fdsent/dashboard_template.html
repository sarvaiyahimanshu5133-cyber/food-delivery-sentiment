<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Delivery Brand Sentiment Analysis</title>
<style>
  :root {
    --bg: #0a1020; --panel: #101a31; --panel2: #15213f; --line: #243455; --ink: #e8eefc; --mut: #8da0c6;
    --neg: #f87171; --neu: #94a3b8; --pos: #34d399; --cy: #38bdf8; --amb: #fbbf24; --pur: #a78bfa;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: radial-gradient(1100px 520px at 10% -8%, #1a2a58 0%, transparent 62%),
                     radial-gradient(900px 480px at 100% 0%, #3a2312 0%, transparent 55%), var(--bg); }
  code, .mono { font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; }
  main { max-width: 1240px; margin: 0 auto; padding: 22px 18px 60px; }
  h1 { margin: 0; font-size: 1.7rem; letter-spacing: -.02em; } h1 span { color: #fb923c; }
  .sub { margin: 2px 0 14px; color: var(--mut); }
  h2 { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); margin: 0 0 10px; font-weight: 700; }
  h3 { margin: 0 0 6px; font-size: 1rem; }
  .card { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .grid { display: grid; gap: 16px; margin-top: 16px; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  @media (max-width: 520px) { .g2 { grid-template-columns: 1fr; } }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { padding: 12px 14px; border-radius: 12px; background: #0c1530; border: 1px solid var(--line); }
  .kpi b { display: block; font-size: 1.45rem; letter-spacing: -.01em; } .kpi span { color: var(--mut); font-size: .8rem; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; position: sticky; top: 0; z-index: 5; padding: 8px 0;
        background: linear-gradient(var(--bg) 70%, transparent); }
  nav button { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
               cursor: pointer; font: inherit; font-weight: 600; }
  nav button[aria-pressed="true"] { background: var(--ink); color: #0a1020; border-color: var(--ink); }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--amb); outline-offset: 2px; }
  section { display: none; } section.on { display: block; }
  .note { color: var(--mut); font-size: .85rem; margin: 8px 0 0; }
  .insight { padding: 8px 12px; border-left: 3px solid var(--amb); background: #0c1530; border-radius: 0 8px 8px 0; margin: 6px 0; color: #d3def5; }
  .insight b { color: var(--amb); }
  select, input[type=text], input[type=search], textarea { font: inherit; background: #0c1530; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  textarea { width: 100%; min-height: 96px; resize: vertical; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; color: var(--mut); font-size: .88rem; }
  input[type=range] { accent-color: var(--cy); }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: .78rem; font-weight: 700; }
  .pill.negative { background: #4a1c21; color: var(--neg); } .pill.positive { background: #0f3b31; color: var(--pos); }
  .pill.neutral { background: #2a3550; color: #cbd5e1; } .pill.tp { background: #1c2a4c; color: #b7c6e6; font-weight: 500; margin: 0 3px 3px 0; }
  .bcard { border-top: 4px solid var(--bc); }
  .big { display: flex; gap: 22px; flex-wrap: wrap; margin: 8px 0; }
  .big div b { display: block; font-size: 2rem; line-height: 1.1; } .big div span { color: var(--mut); font-size: .8rem; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid #1e2c4c; vertical-align: top; }
  th { color: var(--mut); font-weight: 600; font-size: .76rem; }
  td.num { font-variant-numeric: tabular-nums; }
  .win { color: var(--pos); font-weight: 700; }
  svg text { font: 11px system-ui, sans-serif; fill: var(--ink); } svg .mut { fill: var(--mut); } svg .ln { stroke: #243455; }
  svg { max-width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .82rem; color: var(--mut); margin: 6px 0 0; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .cloud { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; line-height: 1.15; margin-top: 8px; }
  .words { display: grid; grid-template-columns: 90px 1fr 44px; gap: 4px 8px; align-items: center; font-size: .85rem; }
  .meter { height: 9px; border-radius: 5px; background: #1c2a4c; overflow: hidden; } .meter i { display: block; height: 100%; border-radius: 5px; }
  .ex { padding: 8px 0; border-bottom: 1px solid #1e2c4c; font-size: .88rem; } .ex small { color: var(--mut); display: block; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chipbtn { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; font: inherit; font-size: .85rem; }
  .chipbtn:hover { border-color: var(--cy); }
  .verdict { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 8px 0 12px; }
  .verdict .pill { font-size: 1.1rem; padding: 4px 16px; }
  .tok { padding: 1px 3px; border-radius: 4px; }
  .what { color: var(--mut); font-size: .84rem; margin: -4px 0 12px; line-height: 1.45; max-width: 100ch; }
  .what::before { content: "i"; display: inline-grid; place-items: center; width: 15px; height: 15px; margin-right: 7px;
                  border-radius: 50%; border: 1px solid var(--mut); font-size: .65rem; font-style: italic; font-weight: 700; vertical-align: 1px; }
  .tabwhat { margin: 2px 0 14px; color: #b7c6e6; font-size: .92rem; }
  .kpi small { display: block; color: #6f83ab; font-size: .72rem; line-height: 1.3; margin-top: 4px; }
  .btn.go { background: var(--cy); color: #04121f; border-color: var(--cy); font-weight: 800; padding: 8px 18px; }
  .btn.alt { background: #fb923c; color: #1e0f02; border-color: #fb923c; font-weight: 800; padding: 8px 18px; }
  .msgl { font-size: .86rem; margin: 8px 0 0; } .msgl.err { color: var(--neg); } .msgl.ok { color: var(--pos); }
  .live { display: inline-block; font-size: .65rem; font-weight: 800; letter-spacing: .08em; padding: 1px 7px; border-radius: 5px; background: #0f3b31; color: var(--pos); margin-left: 8px; vertical-align: 2px; }
  .pager { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .pager button, .btn { font: inherit; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
  .pager button:disabled { opacity: .4; cursor: default; }
  .flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
  .flow .step { flex: 1 1 150px; padding: 10px 12px; border-radius: 10px; background: #0c1530; border: 1px solid var(--line); position: relative; }
  .flow .step b { color: var(--cy); display: block; font-size: .78rem; letter-spacing: .08em; }
  .flow .step p { margin: 3px 0 0; font-size: .86rem; color: #c4d1ee; }
  ul.clean { margin: 6px 0 0; padding-left: 18px; color: #c4d1ee; } ul.clean li { margin: 3px 0; }
</style>
</head>
<body>
<main>
  <h1>Food Delivery <span>Brand Sentiment</span> Analysis</h1>
  <p class="sub" id="sub"></p>
  <div class="kpis" id="kpis"></div>
  <div id="panel"></div>
  <nav id="nav"></nav>
  <p class="tabwhat" id="tabwhat"></p>

  <section id="s-overview"></section>
  <section id="s-trend"></section>
  <section id="s-complaints"></section>
  <section id="s-model"></section>
  <section id="s-try"></section>
  <section id="s-reviews"></section>
  <section id="s-method"></section>
</main>

<script>
const D = /*DATA*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const sum = a => a.reduce((x, y) => x + y, 0);
const pct = v => (Math.round(v * 10) / 10).toString();
const LAB = D.labels;                                   // ["negative","neutral","positive"]
const COL = {negative: '#f87171', neutral: '#94a3b8', positive: '#34d399'};
const BRC = ['#fb923c', '#60a5fa', '#c084fc', '#2dd4bf'];
const bcol = b => BRC[D.brands.indexOf(b) % BRC.length];
const MODEL_COL = {'VADER': '#94a3b8', 'Naive Bayes': '#c084fc', 'Linear SVM': '#fbbf24', 'Logistic Regression': '#38bdf8'};

/* ====================================================== tiny chart toolkit (plain SVG) */
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v || 1))); for (const m of [1, 2, 2.5, 5, 10]) if (v <= m * p) return m * p; return 10 * p; }
function legend(items) { return `<div class="legend">${items.map(([c, t]) => `<span><i style="background:${c}"></i>${esc(t)}</span>`).join('')}</div>`; }

function lineChart({xs, series, yMax, yMin = 0, yTitle, w = 760, h = 300, fmt = v => v, band}) {
  const L = 48, R = 16, T = 14, B = 46, iw = w - L - R, ih = h - T - B;
  const all = series.flatMap(s => s.ys.filter(v => v != null)).concat(band ? band.flatMap(b => b.hi) : []);
  let ym = yMax || niceMax(Math.max(...all, 1));
  if (yMin) ym = yMin + Math.ceil((ym - yMin) / 4) * 4;          // neat tick steps
  const X = i => L + (xs.length === 1 ? iw / 2 : iw * i / (xs.length - 1)), Y = v => T + ih - ih * (v - yMin) / (ym - yMin);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img">`;
  for (let k = 0; k <= 4; k++) { const v = yMin + (ym - yMin) * k / 4; s += `<line class="ln" x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="mut" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(Math.round(v * 10) / 10)}</text>`; }
  const every = Math.ceil(xs.length / 12);
  xs.forEach((x, i) => { if (i % every === 0) s += `<text class="mut" x="${X(i)}" y="${h - B + 16}" text-anchor="middle">${esc(x)}</text>`; });
  if (yTitle) s += `<text class="mut" x="${L}" y="${h - 6}">${esc(yTitle)}</text>`;
  (band || []).forEach(b => { s += `<path d="M${b.hi.map((v, i) => `${X(i)},${Y(v)}`).join(' L')} L${b.lo.map((v, i) => `${X(b.lo.length - 1 - i)},${Y(b.lo[b.lo.length - 1 - i])}`).join(' L')} Z" fill="${b.color}" opacity=".18"/>`; });
  series.forEach(se => {
    const pts = se.ys.map((v, i) => v == null ? null : [X(i), Y(v), v, i]);
    let d = '', pen = false;
    pts.forEach(p => { if (!p) { pen = false; return; } d += `${pen ? 'L' : 'M'}${p[0]},${p[1]} `; pen = true; });
    s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    pts.forEach(p => { if (p) s += `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${se.color}" stroke="#0a1020" stroke-width="1.5"><title>${esc(se.name)} | ${esc(xs[p[3]])}: ${fmt(p[2])}${se.notes ? ' | ' + esc(se.notes[p[3]]) : ''}</title></circle>`; });
  });
  return s + '</svg>';
}

function hGrouped({labels, series, w = 760, max, fmt = v => v + '%'}) {
  const L = 255, R = 50, rowH = 24 * series.length + 14, h = labels.length * rowH + 10, iw = w - L - R;
  const m = max || niceMax(Math.max(...series.flatMap(s => s.vals), 1));
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img">`;
  labels.forEach((lb, i) => {
    const y0 = 5 + i * rowH;
    s += `<text x="${L - 10}" y="${y0 + rowH / 2 - 2}" text-anchor="end">${esc(lb)}</text>`;
    series.forEach((se, j) => { const v = se.vals[i], bw = iw * v / m, y = y0 + j * 24;
      s += `<rect x="${L}" y="${y}" width="${Math.max(bw, 1)}" height="19" rx="4" fill="${se.color}"><title>${esc(se.name)}: ${fmt(v)}</title></rect><text class="mut" x="${L + bw + 6}" y="${y + 14}">${fmt(v)}</text>`; });
  });
  return s + '</svg>';
}

function stacked100(rows, w = 760) {   // rows: [{label, segs:[{v,color,name}]}]
  const L = 90, R = 10, rh = 54, h = rows.length * rh + 26, iw = w - L - R;
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img">`;
  rows.forEach((r, i) => { let x = L; const y = 6 + i * rh;
    s += `<text x="${L - 10}" y="${y + 26}" text-anchor="end" style="font-weight:700;font-size:13px">${esc(r.label)}</text>`;
    r.segs.forEach(sg => { const bw = iw * sg.v / 100; if (bw <= 0) return;
      s += `<rect x="${x}" y="${y}" width="${bw}" height="38" fill="${sg.color}"><title>${esc(sg.name)}: ${pct(sg.v)}%</title></rect>` + (bw > 38 ? `<text x="${x + bw / 2}" y="${y + 24}" text-anchor="middle" style="fill:#07101f;font-weight:800;font-size:13px">${Math.round(sg.v)}%</text>` : '');
      x += bw; }); });
  for (let k = 0; k <= 4; k++) { const x = L + iw * k / 4; s += `<text class="mut" x="${x}" y="${h - 6}" text-anchor="middle">${k * 25}%</text>`; }
  return s + '</svg>';
}

function columns({labels, series, w = 520, h = 240, fmt = v => v + '%'}) {
  const L = 40, R = 10, T = 12, B = 34, iw = w - L - R, ih = h - T - B;
  const m = niceMax(Math.max(...series.flatMap(s => s.vals), 1)), gw = iw / labels.length, bw = Math.min(34, (gw - 14) / series.length);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img">`;
  for (let k = 0; k <= 4; k++) { const v = m * k / 4, y = T + ih - ih * v / m; s += `<line class="ln" x1="${L}" x2="${w - R}" y1="${y}" y2="${y}"/><text class="mut" x="${L - 6}" y="${y + 4}" text-anchor="end">${Math.round(v)}</text>`; }
  labels.forEach((lb, i) => { const x0 = L + i * gw + (gw - bw * series.length) / 2;
    s += `<text class="mut" x="${L + i * gw + gw / 2}" y="${h - 12}" text-anchor="middle">${esc(lb)}</text>`;
    series.forEach((se, j) => { const v = se.vals[i], bh = ih * v / m;
      s += `<rect x="${x0 + j * bw}" y="${T + ih - bh}" width="${bw - 2}" height="${bh}" rx="3" fill="${se.color}"><title>${esc(se.name)}, ${esc(lb)}: ${fmt(v)}</title></rect>`; }); });
  return s + '</svg>';
}

function heatmap(mx, w = 330) {
  const cell = 86, L = 78, T = 28, h = T + cell * 3 + 40;
  let s = `<svg viewBox="0 0 ${L + cell * 3 + 10} ${h}" role="img">`;
  LAB.forEach((l, j) => s += `<text class="mut" x="${L + cell * j + cell / 2}" y="${T - 10}" text-anchor="middle">${l}</text>`);
  mx.forEach((row, i) => { const tot = sum(row) || 1;
    s += `<text class="mut" x="${L - 8}" y="${T + cell * i + cell / 2 + 4}" text-anchor="end">${LAB[i]}</text>`;
    row.forEach((v, j) => { const f = v / tot, good = i === j;
      s += `<rect x="${L + cell * j + 2}" y="${T + cell * i + 2}" width="${cell - 4}" height="${cell - 4}" rx="8" fill="${good ? '#34d399' : '#f87171'}" fill-opacity="${0.08 + 0.85 * f}"><title>actual ${LAB[i]}, predicted ${LAB[j]}: ${v} (${pct(f * 100)}% of ${LAB[i]})</title></rect>` +
           `<text x="${L + cell * j + cell / 2}" y="${T + cell * i + cell / 2 + 2}" text-anchor="middle" style="font-weight:800;font-size:15px">${v}</text>` +
           `<text class="mut" x="${L + cell * j + cell / 2}" y="${T + cell * i + cell / 2 + 17}" text-anchor="middle">${Math.round(f * 100)}%</text>`; }); });
  s += `<text class="mut" x="${L + cell * 1.5}" y="${h - 6}" text-anchor="middle">predicted</text>`;
  return s + '</svg>';
}

/* ====================================================== data helpers */
const R = D.reviews;
const brandOf = r => D.brands[r.b];
const sumRow = b => D.summary.find(x => x.brand === b);
const modelRow = n => D.models.find(m => m.model === n);
const LR = modelRow('Logistic Regression'), VD = modelRow('VADER');

/* ====================================================== header */
function header() {
  const m = D.meta;
  $('sub').textContent = `${m.n.toLocaleString()} reviews of ${D.brands.join(' and ')}` + (m.date_min ? `, ${m.date_min} to ${m.date_max}` : '') + '. Sentiment is predicted from the review text by a model trained on the star ratings.';
  $('kpis').innerHTML = [
    [m.n.toLocaleString(), 'reviews analysed', 'The number of reviews in data/reviews.csv after cleaning.'],
    [D.brands.length + ' brands', D.brands.join(' vs '), 'The apps being compared. Change them in config.py.'],
    [pct(LR.accuracy_pos_vs_neg * 100) + '%', 'trained model accuracy', 'How often our model agrees with the star rating on clearly happy or unhappy reviews, tested on reviews it never saw.'],
    [pct(VD.accuracy_pos_vs_neg * 100) + '%', 'VADER accuracy', 'The ready-made tool on the same reviews, for comparison.'],
  ].map(([a, b, c]) => `<div class="kpi" title="${esc(c)}"><b>${a}</b><span>${esc(b)}</span><small>${esc(c)}</small></div>`).join('');
}

/* ====================================================== 1 overview */
function renderOverview() {
  const cards = D.brands.map(b => {
    const s = sumRow(b), st = D.star_dist[b], tot = sum(st), starNeg = (st[0] + st[1]) / tot * 100;
    const maxStar = Math.max(...st);
    const hist = st.map((v, i) => `<div style="flex:1;text-align:center"><div style="height:46px;display:flex;align-items:end"><div style="width:100%;height:${Math.max(3, v / maxStar * 46)}px;background:${bcol(b)};border-radius:3px 3px 0 0" title="${i + 1} star: ${v} reviews"></div></div><small class="mut" style="color:var(--mut)">${i + 1}&#9733;</small></div>`).join('');
    return `<div class="card bcard" style="--bc:${bcol(b)}"><h3>${esc(b)}</h3><p class="what">Share of this brand's reviews the model predicts as negative or positive from the text alone, plus the average star rating. The little bars count how many reviews gave 1 to 5 stars.</p>
      <div class="big"><div><b style="color:var(--neg)">${pct(s['negative_%'])}%</b><span>negative reviews</span></div>
      <div><b style="color:var(--pos)">${pct(s['positive_%'])}%</b><span>positive reviews</span></div>
      <div><b>${s.avg_stars.toFixed(2)}</b><span>average stars</span></div></div>
      <div style="display:flex;gap:6px;margin:6px 0">${hist}</div>
      <p class="note">${s.reviews.toLocaleString()} reviews. By star rating alone, ${pct(starNeg)}% are 1-2 stars; the model predicts ${pct(s['negative_%'])}% negative from the text.</p></div>`;
  }).join('');
  const rows = D.brands.map(b => { const s = sumRow(b);
    return {label: b, segs: [{v: s['negative_%'], color: COL.negative, name: 'negative'}, {v: s['neutral_%'], color: COL.neutral, name: 'neutral'}, {v: s['positive_%'], color: COL.positive, name: 'positive'}]}; });
  const stars = columns({labels: ['1', '2', '3', '4', '5'], series: D.brands.map(b => ({name: b, color: bcol(b), vals: D.star_dist[b].map(v => v / sum(D.star_dist[b]) * 100)})), fmt: v => pct(v) + '%'});
  // plain-language insights
  const sb = D.brands.slice().sort((a, c) => sumRow(c)['negative_%'] - sumRow(a)['negative_%']), ins = [];
  if (sb.length > 1) ins.push(`<b>${esc(sb[0])}</b> has ${Math.round(sumRow(sb[0])['negative_%'] - sumRow(sb[sb.length - 1])['negative_%'])} percentage points more negative reviews than <b>${esc(sb[sb.length - 1])}</b> (${pct(sumRow(sb[0])['negative_%'])}% vs ${pct(sumRow(sb[sb.length - 1])['negative_%'])}%).`);
  D.brands.forEach(b => { const t = D.topics.filter(x => x.brand === b && x.topic !== D.no_topic).sort((x, y) => y['negative_reviews_%'] - x['negative_reviews_%'])[0];
    if (t) ins.push(`The most common complaint about <b>${esc(b)}</b> is <b>${esc(t.topic)}</b>: it appears in ${pct(t['negative_reviews_%'])}% of its negative reviews.`); });
  ins.push(`The trained model is right on <b>${pct(LR.accuracy_pos_vs_neg * 100)}%</b> of clearly happy or unhappy reviews; the ready-made VADER tool is right on only <b>${pct(VD.accuracy_pos_vs_neg * 100)}%</b>.`);
  $('s-overview').innerHTML = `<div class="grid g2" style="margin-top:0">${cards}</div>
    <div class="grid g2"><div class="card"><h2>Sentiment of reviews, by brand</h2>${stacked100(rows)}${legend([[COL.negative, 'negative'], [COL.positive, 'positive'], [COL.neutral, 'neutral']])}
    <p class="note">Only about 4% of reviews have 3 stars (neutral), so the model files almost everything as positive or negative. See Model Lab.</p></div>
    <div class="card"><h2>Star ratings (share of each brand's reviews)</h2>${stars}${legend(D.brands.map(b => [bcol(b), b]))}
    <p class="note">People who write reviews are mostly very happy (5 stars) or very angry (1 star).</p></div></div>
    <div class="card" style="margin-top:16px"><h2>What the data says</h2>${ins.map(t => `<div class="insight">${t}</div>`).join('')}</div>`;
}

/* ====================================================== 2 trend */
const TR = {by: 'hour', min: 10};
function renderTrend() {

/* ====================================================== 5 try it (the SAME model, running in the browser) */
const M = D.jsmodel, VOC = new Map(M.vocab.map((w, i) => [w, i]));
const POSE = new Set([...D.emoji.pos]), NEGE = new Set([...D.emoji.neg]);
function cleanText(text) {                        // identical to fdsent/clean.py
  let t = String(text).normalize('NFKC').toLowerCase();
  t = t.replace(/https?:\/\/\S+|www\.\S+|@[\p{L}\p{N}_]+/gu, ' ');
  let o = ''; for (const c of t) o += POSE.has(c) ? ' posemoji ' : NEGE.has(c) ? ' negemoji ' : c;
  t = o.replace(/(.)\1{2,}/gu, '$1$1').replace(/[^\p{L}\p{N}_\s'\u0900-\u097f]/gu, ' ');
  return t.replace(/\s+/gu, ' ').trim();
}
function predictText(text) {                      // TF-IDF + Logistic Regression, same maths as scikit-learn
  const tokens = cleanText(text).split(' ').filter(Boolean), grams = tokens.slice();
  for (let i = 0; i + 1 < tokens.length; i++) grams.push(tokens[i] + ' ' + tokens[i + 1]);
  const counts = new Map();
  grams.forEach(g => { if (VOC.has(g)) counts.set(g, (counts.get(g) || 0) + 1); });
  const feats = []; let norm = 0;
  counts.forEach((c, g) => { const j = VOC.get(g), v = (1 + Math.log(c)) * M.idf[j]; feats.push([g, j, v]); norm += v * v; });
  norm = Math.sqrt(norm) || 1;
  feats.forEach(f => f[2] /= norm);
  const logit = M.classes.map((_, c) => M.intercept[c] + sum(feats.map(f => M.coef[c][f[1]] * f[2])));
  const mx = Math.max(...logit), ex = logit.map(v => Math.exp(v - mx)), z = sum(ex), probs = ex.map(v => v / z);
  const iN = M.classes.indexOf('negative'), iP = M.classes.indexOf('positive');
  const push = feats.map(f => ({g: f[0], d: (M.coef[iN][f[1]] - M.coef[iP][f[1]]) * f[2]}));   // >0 pushes towards negative
  return {tokens, probs, label: M.classes[probs.indexOf(Math.max(...probs))], push};
}
const EXAMPLES = ['Delivery was very late and the food was cold', 'Super fast delivery, food was hot and tasty. Loved it!', 'Worst app. Order cancelled after 1 hour and no refund. Customer care is useless.',

      ${M.classes.map((c, i) => `<div style="display:grid;grid-template-columns:70px 1fr 52px;gap:8px;align-items:center;margin:4px 0"><span>${c}</span><div class="meter" style="height:12px"><i style="width:${r.probs[i] * 100}%;background:${COL[c]}"></i></div><span class="mut" style="color:var(--mut)">${pct(r.probs[i] * 100)}%</span></div>`).join('')}
      ${LIVE ? '<div id="vaderrow" class="note" style="margin:10px 0 0">Asking VADER...</div>' : '<div class="note" style="margin:10px 0 0">VADER\'s answer appears here when you start the project with <code>python run.py</code>.</div>'}
      <h3 style="margin-top:14px">What the model sees</h3><p style="margin:4px 0;line-height:1.9">${toks || '<span class="note">no known words</span>'}</p>
      <p class="note" style="margin-top:2px"><span class="tok" style="background:rgba(248,113,113,.6)">red</span> pushes towards negative, <span class="tok" style="background:rgba(52,211,153,.6)">green</span> towards positive. Words the model never saw in training have no colour.</p>

  };
  const bind = (id, key) => $(id).addEventListener(id === 'rq' ? 'input' : 'change', e => { RV[key] = e.target.value; RV.page = 0; draw(); });
  bind('rb', 'brand'); bind('rp', 'pred'); bind('rs', 'stars'); bind('rt', 'topic'); bind('ro', 'sort'); bind('rq', 'q');
  $('rprev').onclick = () => { RV.page--; draw(); }; $('rnext').onclick = () => { RV.page++; draw(); };
  draw();
}

/* ====================================================== 7 method */
function renderMethod() {
  const step = (n, t, p) => `<div class="step"><b>${n}</b><h3>${t}</h3><p>${p}</p></div>`;
  $('s-method').innerHTML = `<div class="card"><h2>How the project works</h2><div class="flow">
    ${step('1 COLLECT', 'Reviews', 'Real Google Play reviews with a star rating and text (<code>fdsent/data.py</code>).')}
    ${step('2 CLEAN', 'Text cleaning', 'Lowercase, remove links, shorten "soooo" to "soo", turn emojis into words (<code>clean.py</code>).')}
    ${step('3 NUMBERS', 'TF-IDF', 'Each word gets a weight: rare, telling words count more than "the". Word pairs are included, so "not good" differs from "good".')}
    ${step('4 LEARN', 'Models', 'Naive Bayes, Linear SVM and Logistic Regression learn from the star ratings. VADER needs no training (<code>models.py</code>).')}
    ${step('5 TEST', 'Cross-validation', 'Train on 4 parts, test on the 5th, repeat 5 times. Like testing a student on questions they have not memorised.')}
    ${step('6 ANALYSE', 'Brand insights', 'Sentiment share, trend, complaint topics and common words (<code>analyze.py</code>).')}
    ${step('7 SHOW', 'This dashboard', 'One HTML page. The trained model runs inside it, so there is no server (<code>dashboard.py</code>).')}</div></div>
    <div class="grid g2"><div class="card"><h2>Key ideas</h2><ul class="clean">
      <li><b>Supervised learning:</b> the star rating is the answer key the model learns from.</li>
      <li><b>TF-IDF:</b> turns text into numbers. Term frequency (how often a word appears in a review) times inverse document frequency (how rare it is across reviews).</li>
      <li><b>Logistic Regression:</b> multiplies each word weight by a learned number and turns the total into probabilities for negative / neutral / positive.</li>
      <li><b>Accuracy vs F1:</b> accuracy is the share of correct answers. F1 balances precision and recall per class, so a rare class (neutral) cannot hide behind a big one.</li>
      <li><b>Class imbalance:</b> about 67% of reviews are positive, so a model that always says "positive" is already 67% accurate. That is why we also report F1.</li></ul></div>
    <div class="card"><h2>Limitations (honest list)</h2><ul class="clean">
      <li>The reviews cover only <b>${D.meta.days} day(s)</b>, so there is no long-term trend yet.</li>
      <li>Star ratings are an imperfect answer key: a 5-star review can still contain a complaint.</li>
      <li>Play Store reviewers are mostly very happy or very angry, not a random sample of customers.</li>
      <li>Neutral is weak (only about 4% of reviews are 3 stars).</li>
      <li>Very short or negated phrases (like "not good at all") can be misread, because the model has seen few of them.</li>
      <li>Hinglish (Hindi in English letters) is only 1-2% of the reviews, so the model handles it poorly.</li>
      <li>Complaint topics come from keyword lists, so unusual wording is missed.</li></ul></div></div>`;
}

/* ====================================================== control panel (live) */
async function post(url, body) {
  let r;
  try { r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}); }
  catch (e) { throw new Error('Cannot reach the dashboard server. Is "python run.py" still running in its window?'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('server error ' + r.status));
  return j;
}
let jobStarted = false, pollTimer = null;
function renderPanel() {
  const el = $('panel');
  if (!LIVE) { el.innerHTML = '<div class="card" style="margin-bottom:14px"><h2>Control panel</h2><p class="note" style="margin:0">The live buttons are off because you opened the saved file. Start the project with <code>python run.py</code> to use them.</p></div>'; return; }
  el.innerHTML = `<div class="card" style="margin-bottom:14px"><h2>Control panel <span class="live">LIVE</span></h2>
    <div class="bar" style="margin:0"><button class="btn go" id="p-rerun">&#8635; Re-run analysis</button>
    <span style="margin-left:14px">Download the newest</span><select id="p-count"><option>500</option><option selected>1000</option><option>2000</option><option>5000</option></select><span>reviews per brand</span>
    <button class="btn alt" id="p-collect">&#11015; Download fresh reviews</button></div>
    <div id="p-prog" hidden style="margin-top:10px"><div class="meter" style="height:12px"><i id="p-bar" style="width:0;background:var(--cy)"></i></div><p class="note" id="p-stage" style="margin:4px 0 0"></p></div>
    <p class="msgl" id="p-msg" hidden></p></div>`;
  $('p-rerun').onclick = () => startJob('/api/rerun', {});
  $('p-collect').onclick = () => startJob('/api/collect', {count: +$('p-count').value});
  fetch('/api/status').then(r => r.json()).then(s => { if (s.running) { jobStarted = true; poll(); } }).catch(() => {});
}
async function startJob(path, body) {
  const msg = $('p-msg'); msg.hidden = true;
  try { await post(path, body); jobStarted = true; poll(); }
  catch (e) { msg.hidden = false; msg.className = 'msgl err'; msg.textContent = e.message; }
}
function poll() {
  clearInterval(pollTimer);
  ['p-rerun', 'p-collect'].forEach(id => $(id).disabled = true);
  $('p-prog').hidden = false;
  const tick = async () => {
    let s; try { s = await (await fetch('/api/status')).json(); } catch (e) { return; }
    $('p-bar').style.width = s.pct + '%'; $('p-stage').textContent = s.stage + ' (' + s.pct + '%)';
    if (s.running) return;
    clearInterval(pollTimer); ['p-rerun', 'p-collect'].forEach(id => $(id).disabled = false);
    if (s.error) { const m = $('p-msg'); m.hidden = false; m.className = 'msgl err'; m.textContent = s.error; $('p-prog').hidden = true; }
    else if (s.done && jobStarted) { $('p-stage').textContent = 'Done. Reloading the dashboard with the new results...'; setTimeout(() => location.reload(), 500); }
  };
  pollTimer = setInterval(tick, 500); tick();
}

function annotate() {
  document.querySelectorAll('main h2').forEach(h => {
    const nx = h.nextElementSibling;
    if (nx && nx.classList.contains('what')) return;
    const t = h.textContent.trim().toLowerCase(), key = Object.keys(WHAT).find(k => t.startsWith(k));
    if (!key) return;
    const p = document.createElement('p'); p.className = 'what'; p.textContent = WHAT[key]; h.after(p);
  });
}
new MutationObserver(annotate).observe(document.querySelector('main'), {childList: true, subtree: true});
